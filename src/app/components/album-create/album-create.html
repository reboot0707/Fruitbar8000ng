<h1>新增專輯</h1>

<hr />
<div class="row">
    <div class="col-md-4">
        <div>
            <div class="text-danger"></div>
            <div class="form-group">
                <label class="control-label">專輯名稱</label>
                <input class="form-control" [(ngModel)]="inputAlbumName"/>
                <span class="text-danger"></span>
            </div>
            <div class="form-group">
                <label class="control-label">發行日期</label>
                <input class="form-control" type="date" [(ngModel)]="inputReleaseDate"/>
                <span class="text-danger"></span>
            </div>
            <div class="form-group">
                <label class="control-label">專輯類型</label>
                <input class="form-control" [(ngModel)]="inputAlbumType"/>
                <span class="text-danger"></span>
            </div>
            <div class="form-group mt-2 d-flex gap-2">
                <button class="btn btn-primary" (click)="goAddAlbum()">新增專輯</button>
                <button class="btn btn-secondary" routerLink="/albums">回到列表</button>
            </div>
        </div>
    </div>
</div>
